<meta charset="utf-8">
<meta name="notes-build" content="{{ build }}">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deeperguard">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png?v={{ build }}">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v={{ build }}">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/icon-192.png?v={{ build }}">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png?v={{ build }}">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/static/css/app.css?v={{ build }}">
<script>
  (function () {
    try {
      var prefs = JSON.parse(localStorage.getItem('deeperguard-prefs') || localStorage.getItem('homelab-notes-prefs') || '{}');
      var theme = 'light';
      if (prefs.theme === 'dark') theme = 'dark';
      else if (prefs.theme === 'light') theme = 'light';
      else if (prefs.theme === 'system' && window.matchMedia) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute('content', theme === 'light' ? '#ffffff' : '#0f1419');
    } catch (e) {}
  })();
</script>
